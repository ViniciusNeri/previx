<style>
        body {
            background-color: #fef7ff;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="min-h-screen flex items-center justify-center bg-background p-4">
<!-- Shell Suppression: This is a transactional screen, so the global navigation (TopNavBar/SideNavBar) is excluded to focus on the recovery flow. -->
<main class="w-full max-w-[440px]">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm overflow-hidden p-8 md:p-10">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-8">
<div class="mb-4 bg-primary-fixed p-3 rounded-lg">
<span class="material-symbols-outlined text-primary text-[32px]">lock_reset</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface mb-2">Recuperar Senha</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center px-4">
                    Insira o e-mail associado à sua conta e enviaremos as instruções para redefinição.
                </p>
</div>
<!-- Form Flow -->
<form class="space-y-6">
<div class="flex flex-col gap-2">
<label class="text-label-bold font-label-bold text-on-surface-variant" for="email">E-MAIL PROFISSIONAL</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-body-md font-body-md outline-none transition-shadow" id="email" placeholder="nome@previx.com.br" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-bold py-3.5 px-6 rounded-lg hover:bg-primary-container transition-colors shadow-sm active:scale-[0.98]" type="submit">
                    Enviar link
                </button>
</form>
<!-- Success Confirmation Message (Hidden by default or shown via logic) -->
<div class="mt-8 hidden flex items-start gap-4 p-4 bg-surface-container-high rounded-lg border-l-4 border-primary">
<span class="material-symbols-outlined text-primary" data-icon="check_circle">check_circle</span>
<div class="flex flex-col gap-1">
<span class="text-label-bold font-label-bold text-on-surface">Link enviado!</span>
<span class="text-body-sm font-body-sm text-on-surface-variant leading-relaxed">Verifique sua caixa de entrada e siga as instruções para criar uma nova senha.</span>
</div>
</div>
<!-- Alternative State: Error Messaging Style Guide Consistency -->
<!-- 
            <div class="mt-8 flex items-start gap-4 p-4 bg-error-container rounded-lg border-l-4 border-error">
                <span class="material-symbols-outlined text-error" data-icon="error">error</span>
                <div class="flex flex-col gap-1">
                    <span class="text-label-bold font-label-bold text-on-error-container">E-mail não encontrado</span>
                    <span class="text-body-sm font-body-sm text-on-error-container opacity-80 leading-relaxed">Verifique se o e-mail digitado está correto ou entre em contato com o suporte.</span>
                </div>
            </div> 
            -->
<!-- Return Link -->
<div class="mt-10 pt-6 border-t border-outline-variant text-center">
<a class="inline-flex items-center gap-2 text-primary font-label-bold hover:text-primary-container transition-colors" href="02_login.html">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Voltar para o login
                </a>
</div>
</div>
<!-- Footer / Support Context -->
<p class="text-center mt-6 text-body-sm font-body-sm text-outline">
            Precisa de ajuda? <a class="underline hover:text-on-surface transition-colors" href="02_login.html">Entre em contato com o suporte</a>
</p>
</main>
<!-- Visual Anchor Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none">
<div class="absolute -top-1/2 -left-1/4 w-[1000px] h-[1000px] bg-secondary-fixed rounded-full blur-[120px]"></div>
<div class="absolute -bottom-1/2 -right-1/4 w-[800px] h-[800px] bg-primary-fixed rounded-full blur-[100px]"></div>
</div>
